apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          ports:
            - containerPort: PORT_CONTAINER

          env:
            - name: FILES_SERVICE_AVATAR_UPLOAD_PATH
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: FILES_SERVICE_AVATAR_UPLOAD_PATH
            - name: FILES_SERVICE_CHUNKS_DIR
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: FILES_SERVICE_CHUNKS_DIR
            - name: UPLOAD_SERVICE_URL_PREFIX
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: UPLOAD_SERVICE_URL_PREFIX
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: AWS_REGION
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: AWS_SECRET_KEY
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: AWS_ACCESS_KEY
            - name: RMQ_URL
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: RMQ_URL
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: yogram-files-production-config-secret
                  key: BUCKET
