apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          ports:
            - containerPort: PORT_CONTAINER

          env:
            - name: POSTGRES_TYPE
              valueFrom:
                secretKeyRef:
                  name: yogram-posts-production-config-secret
                  key: POSTGRES_TYPE
            - name: RMQ_URL
              valueFrom:
                secretKeyRef:
                  name: yogram-posts-production-config-secret
                  key: RMQ_URL
            - name: FILES_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: yogram-posts-production-config-secret
                  key: FILES_SERVICE_URL
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: yogram-posts-production-config-secret
                  key: BUCKET
            - name: FILES_SERVICE_POSTS_UPLOAD_PATH
              valueFrom:
                secretKeyRef:
                  name: yogram-posts-production-config-secret
                  key: FILES_SERVICE_POSTS_UPLOAD_PATH
